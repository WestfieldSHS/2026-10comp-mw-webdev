<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Layout Site</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">LOGO</div>
        <nav>
            <ul>
                <li><a href="#home">HOME</a></li>
                <li><a href="#books">books</a></li>
                <li><a href="#charecters">charecters</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->
    <section id="home" class="hero">
        <h1>The Naturals</h1>
        <p>Jennifer Lynn Barnes</p>
        <p>book series</p>
        <button>Learn More</button>
    </section>

    <!-- ABOUT -->
    <section id="books" class="book">
        <h2>books</h2>
        <div class="books-grid">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </section>

    <!-- SERVICES -->
    <section id="charecters" class="charecters">
        <h2>charecters</h2>
        <div class="charecters-grid">
            <div class="charecters-box"></div>
            <div class="charecters-box"></div>
            <div class="charecters-box"></div>
        </div>
    </section>

    <!-- PORTFOLIO -->
    <section id="portfolio" class="portfolio">
        <h2>PORTFOLIO</h2>
        <div class="portfolio-grid">
            <div class="portfolio-box"></div>
            <div class="portfolio-box"></div>
            <div class="portfolio-box"></div>
            <div class="portfolio-box"></div>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact">
        <h2>CONTACT</h2>
        <div class="contact-box"></div>
        <button>Send Message</button>
    </section>

    <footer>
        <p>© 2026 Your Website</p>
    </footer>

</body>
</html>

</html>
